<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="Contact White Water Rafting Company for reservations, questions, and feedback. Find our address, phone, email, and location map. ">
    <meta name="author" content="Lorraine Marange">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>White Water Rafting Company</h1>
        <div class="contact-grid">
            <div class="map">
                <p>7132 Protea Reeves Street<br>
                    Sandton, Johannesburg<br>
                    +27 63 803 9875<br>
                    info@whitewaterrafting.com
                </p>
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3950.0!2d-111.1!3d36.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzbCsDawJzAwLjAiTiAxMTHCsDA2JzAwLjAiVw!5e0!3m2!1sen!2sus!4v1234567890"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <fieldset>
                    <legend>Purpose</legend>
                    <label><input type="radio" id="general" name="purpose" value="general"> General
                        Inquiry</label>
                    <label><input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation
                        Question</label>
                    <label><input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website
                        Suggestion</label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>

                <div>
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter"> Please subscribe
                        me to the monthly newsletter.
                    </label>
                </div>

                <div>
                    <button type="submit">Get in Touch!</button>
                </div>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/employee-lorraine.jpg" alt="Lorraine-General Manager">
                    <figcaption>Lorraine-Gen Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-sarah.jpg" alt="Sarah-The Friendly Lead Guide">
                    <figcaption>Sarah-Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-john.jpg" alt="John-Makes Sure Everyone is Safe">
                    <figcaption>John-Safety Officer</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-lisa.jpg" alt="Lisa-Very friendly and Reliable ">
                    <figcaption>Lisa-Customer Support</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©️2026 White Water Rafting Company | Lorraine Marange</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png"
                  alt="Facebook social media icon linking to White Water Rafting company Facebook page"></a>
            <a href="https://twitter.com"><img src="images/twitter.png"
                  alt="Twitter social media icon linking to White Water Rafting  company Twitter page"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram social media icon linking to White Water Rafting company Instagram page"></a>
        </nav>
    </footer>
</body>

</html>
